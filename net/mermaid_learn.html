<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Mermaid 全面学习手册</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --blue: #0071e3; --blue-light: #5ac8fa;
    --green: #34c759; --gold: #ffd60a;
    --gray1: #1d1d1f; --gray2: #86868b; --gray3: #f5f5f7; --gray4: #fbfbfd;
    --border: #d2d2d7;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Arial, sans-serif;
    background: #1a1a1a;
    color: var(--gray1);
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  .topbar { height: 52px; background: rgba(30,30,30,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid #333; display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; z-index: 10; }
  .topbar-title { font-size: 15px; font-weight: 600; color: #fff; flex: 1; }
  .topbar-title span { color: var(--blue); margin-right: 6px; }
  .page-indicator { font-size: 13px; color: #888; background: #2a2a2a; padding: 5px 14px; border-radius: 980px; border: 1px solid #444; }
  .page-indicator .current { color: var(--blue); font-weight: 700; }
  .progress-bar { height: 3px; background: #333; flex-shrink: 0; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--blue-light)); transition: width 0.4s ease; }
  .book-container { flex: 1; display: flex; overflow: hidden; position: relative; }
  .sidebar { width: 220px; background: #f5f5f7; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--gray2); }
  .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
  .sidebar-list::-webkit-scrollbar { width: 4px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
  .chapter-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: none; border-radius: 8px; background: transparent; cursor: pointer; font-family: inherit; text-align: left; transition: all 0.15s; font-size: 13px; color: var(--gray1); }
  .chapter-btn:hover { background: rgba(0,113,227,0.08); }
  .chapter-btn.active { background: var(--blue); color: #fff; }
  .chapter-btn .ch-num { font-size: 10px; font-weight: 700; opacity: 0.6; width: 20px; flex-shrink: 0; }
  .chapter-btn .ch-icon { font-size: 14px; flex-shrink: 0; }
  .chapter-btn .ch-name { flex: 1; line-height: 1.3; }
  .page-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #1a1a1a; }
  .page-frame { width: 100%; height: 100%; max-width: 900px; background: #fff; border-radius: 12px; margin: 16px; box-shadow: 0 0 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .page-header { padding: 20px 28px 16px; border-bottom: 1px solid var(--border); background: var(--gray4); flex-shrink: 0; }
  .page-chapter-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--blue); margin-bottom: 6px; }
  .page-title { font-size: 22px; font-weight: 800; color: var(--gray1); letter-spacing: -0.5px; }
  .page-desc { font-size: 13px; color: var(--gray2); margin-top: 4px; }
  .page-content { flex: 1; overflow-y: auto; padding: 20px 28px 28px; }
  .page-content::-webkit-scrollbar { width: 6px; }
  .page-content::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
  .concept-card { background: var(--gray4); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .concept-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--gray1); }
  .concept-card p { font-size: 13px; color: var(--gray2); line-height: 1.7; }
  .concept-card code { font-family: 'SF Mono', monospace; font-size: 12px; background: var(--gray3); padding: 2px 5px; border-radius: 4px; color: var(--blue); }
  .highlight-box { background: rgba(0,113,227,0.05); border: 1px solid rgba(0,113,227,0.2); border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
  .highlight-box h4 { font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 6px; }
  .highlight-box p { font-size: 12px; color: var(--gray2); line-height: 1.65; }
  .tip-box { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
  .tip-box h4 { font-size: 13px; font-weight: 700; color: #2e7d32; margin-bottom: 6px; }
  .tip-box p { font-size: 12px; color: #388e3c; line-height: 1.65; }
  .warning-box { background: #fff8e1; border: 1px solid #ffe082; border-radius: 10px; padding: 14px 16px; margin: 14px 0; }
  .warning-box h4 { font-size: 13px; font-weight: 700; color: #f57c00; margin-bottom: 6px; }
  .warning-box p { font-size: 12px; color: #795548; line-height: 1.65; }
  .mini-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); margin: 12px 0; }
  .mini-table th { background: var(--gray3); padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 700; color: var(--gray2); letter-spacing: 0.3px; border-bottom: 1px solid var(--border); }
  .mini-table td { padding: 8px 12px; font-size: 12px; color: var(--gray1); border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  .mini-table tr:last-child td { border-bottom: none; }
  .mini-table tr:hover td { background: #fafafa; }
  .mini-table code { font-family: 'SF Mono', monospace; font-size: 11px; background: var(--gray3); padding: 1px 5px; border-radius: 3px; color: var(--blue); }
  .sub-title { font-size: 15px; font-weight: 700; color: var(--gray1); margin: 20px 0 10px; padding-top: 16px; border-top: 1px solid var(--border); }
  .demo-block { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .demo-header { padding: 10px 16px; background: var(--gray4); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .demo-title { font-size: 13px; font-weight: 600; color: var(--gray1); }
  .demo-tags { display: flex; gap: 5px; }
  .demo-tag { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 980px; }
  .demo-tag-type { background: rgba(0,113,227,0.1); color: var(--blue); }
  .demo-tag-level { background: var(--gray3); color: var(--gray2); }
  .demo-body { padding: 16px; }
  .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .demo-half h4 { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--gray2); margin-bottom: 6px; }
  .code-box { background: #1c1c1e; border-radius: 8px; padding: 12px; position: relative; }
  .code-box pre { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.65; color: #e8e8ed; white-space: pre-wrap; word-break: break-all; margin: 0; }
  .copy-btn { position: absolute; top: 6px; right: 6px; padding: 3px 8px; background: rgba(255,255,255,0.1); color: #888; border: none; border-radius: 4px; font-size: 10px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .copy-btn:hover { background: var(--blue); color: #fff; }
  .preview-box { background: var(--gray4); border: 1px solid var(--border); border-radius: 8px; min-height: 80px; padding: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .preview-box img { max-width: 100%; height: auto; opacity: 0; transition: opacity 0.3s ease; }
  .preview-box img.loaded { opacity: 1; }
  .preview-box img.failed { opacity: 0.25; }
  .faq-item { background: #fff; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .faq-q { padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--gray1); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .faq-q:hover { background: var(--gray4); }
  .faq-a { padding: 0 14px 10px; font-size: 12px; color: var(--gray2); line-height: 1.65; border-top: 1px solid var(--border); padding-top: 10px; }
  .prompt-item { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; cursor: pointer; position: relative; transition: all 0.2s; }
  .prompt-item:hover { border-color: var(--blue); }
  .prompt-item h4 { font-size: 13px; font-weight: 700; color: var(--gray1); margin-bottom: 5px; }
  .prompt-item p { font-size: 12px; color: var(--blue); line-height: 1.5; }
  .prompt-copy { position: absolute; top: 10px; right: 10px; padding: 3px 8px; background: var(--gray3); color: var(--gray2); border: none; border-radius: 4px; font-size: 10px; cursor: pointer; font-family: inherit; }
  .prompt-copy:hover { background: var(--blue); color: #fff; }
  .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; background: rgba(255,255,255,0.9); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; color: var(--gray1); transition: all 0.2s; box-shadow: 0 2px 12px rgba(0,0,0,0.15); z-index: 5; user-select: none; }
  .nav-arrow:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
  .nav-arrow:active { transform: translateY(-50%) scale(0.95); }
  .nav-arrow.disabled { opacity: 0.2; cursor: not-allowed; pointer-events: none; }
  .nav-prev { left: calc(50% - 470px); }
  .nav-next { right: calc(50% - 470px); }
  .bottombar { height: 48px; background: rgba(30,30,30,0.95); backdrop-filter: blur(20px); border-top: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; z-index: 10; }
  .bottom-nav { display: flex; gap: 8px; }
  .nav-btn { display: flex; align-items: center; gap: 5px; padding: 6px 14px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #ccc; font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .nav-btn:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
  .bottom-hint { font-size: 12px; color: #555; }
  .bottom-hint kbd { background: #2a2a2a; border: 1px solid #444; border-radius: 4px; padding: 1px 6px; font-size: 11px; color: #888; }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  .slide-in { animation: fadeSlideIn 0.3s ease forwards; }
  @media (max-width: 768px) {
    .sidebar { width: 180px; }
    .page-frame { margin: 8px; border-radius: 8px; }
    .demo-grid { grid-template-columns: 1fr; }
    .nav-prev { left: calc(50% - 360px); }
    .nav-next { right: calc(50% - 360px); }
  }
</style>
</head>

<div class="topbar">

      <div class="page-header">

</div>

<script>
// ===== Mermaid Diagram URL Generator =====
const imgCache = new Map();

function mm(code) {
  const safe = code.replace(/\bgraph\b/g, 'flowchart');
  const b64 = btoa(unescape(encodeURIComponent(safe)));
  return 'https://mermaid.ink/img/' + b64;
}

// ===== Chapters Data =====
const chapters = [
  {
    num: 1, title: "先搞清楚：什么是 Mermaid？", desc: "一句话解释 + 为什么对你有用", icon: "🎯",
    content: `
      <div class="concept-card">
        <h3>🎯 一句话解释</h3>
        <p><strong>Mermaid 是一种用「文字代码」画图的技术。</strong>你写几行简单的代码，就能变成一张漂漂亮亮的图表。不需要设计软件，不需要鼠标画图。</p>
      </div>
      <div class="concept-card">
        <h3>💡 为什么对你特别有用？</h3>
        <p>你和 AI 对话时，只需要描述"我要一个什么样的图"，AI 就能生成 Mermaid 代码。把代码嵌入 Markdown 文档，支持 Mermaid 的编辑器（Obsidian、Notion、飞书文档、GitHub）会自动渲染成图。<br><br><strong>核心价值：</strong>用说话/打字的方式就能画出专业图表，比任何画图软件都快。</p>
      </div>
      <div class="concept-card">
        <h3>🗺️ Mermaid 能画哪些图？</h3>
        <table class="mini-table">
          <tr><th>图表</th><th>用途</th><th>关键词</th></tr>
          <tr><td>流程图</td><td>展示业务流程、决策逻辑</td><td><code>flowchart TD</code></td></tr>
          <tr><td>时序图</td><td>展示多角色交互顺序</td><td><code>sequenceDiagram</code></td></tr>
          <tr><td>甘特图</td><td>展示项目进度和时间</td><td><code>gantt</code></td></tr>
          <tr><td>饼图</td><td>展示占比和比例</td><td><code>pie</code></td></tr>
          <tr><td>状态图</td><td>展示状态变化和流转</td><td><code>stateDiagram-v2</code></td></tr>
          <tr><td>旅程图</td><td>展示用户使用路径和满意度</td><td><code>journey</code></td></tr>
          <tr><td>类图</td><td>展示程序代码的类和关系</td><td><code>classDiagram</code></td></tr>
          <tr><td>Git图</td><td>展示代码分支和提交历史</td><td><code>gitGraph</code></td></tr>
        </table>
      </div>
      <div class="highlight-box">
        <h4>💬 举个例子</h4>
        <p><strong>传统方式：</strong>打开 Visio/Figma → 找模板 → 拖拽形状 → 调整箭头 → 导出图片 → 插入文档。<br><br><strong>Mermaid 方式：</strong>直接跟 AI 说"帮我画一个用户下单流程的时序图"，AI 生成代码，你复制进 MD 文档，渲染完成。</p>
      </div>
    `
  },
  {
    num: 2, title: "Mermaid 和 Markdown 的关系", desc: "搞清楚两者到底是什么关系", icon: "🔗",
    content: `
      <div class="concept-card">
        <h3>🔗 关系：Mermaid 是 Markdown 的扩展</h3>
        <p>Markdown（MD）是一种写文档的语言，支持标题、加粗、列表、代码块等格式。<br><br>Mermaid 是 MD 里的一个<strong>代码块类型</strong>。在 MD 里写一个特殊的代码块，声明语言为 <code>mermaid</code>，渲染器就会把它变成图表。</p>
      </div>
      <div class="demo-block">
        <div class="demo-header"><div class="demo-title">写法和渲染效果对照</div><div class="demo-tags"><span class="demo-tag demo-tag-type">MD源码</span></div></div>
        <div class="demo-body">
          <div class="demo-grid">
            <div class="demo-half"><h4>📝 MD 中的写法</h4><div class="code-box"><button class="copy-btn" onclick="copyCode(this)">复制</button><pre>\`\`\`mermaid
flowchart TD
  A[开始] --> B{判断}
  B -->|是| C[执行]
\`\`\`
</pre></div></div>
            <div class="demo-half"><h4>🖼️ 渲染效果</h4><div class="preview-box"><img data-mm="flowchart TD; A[开始] --> B{判断}; B -->|是| C[执行]" alt="Mermaid渲染效果" /></div></div>
          </div>
        </div>
      </div>
      <div class="tip-box"><h4>✅ 关键记忆点</h4><p>写法就这一句：<code>\`\`\`mermaid</code> 开头，<code>\`\`\`</code> 结尾，中间写 Mermaid 代码。编辑器自动识别并渲染。</p></div>
      <div class="warning-box"><h4>⚠️ 注意：不是所有工具都支持</h4><p>Obsidian、Notion、飞书文档、GitHub、GitLab、Typora 都支持 Mermaid。但微信公众平台、知乎等平台不支持，Mermaid 代码会直接显示为代码文本。</p></div>
    `
  },
  {
    num: 3, title: "流程图 flowchart（最最基础）", desc: "这是 Mermaid 里最常用的图表", icon: "📐",
    content: `
      <div class="concept-card"><h3>📐 flowchart 基础结构</h3><p>流程图代码由三部分组成：<br>1. <code>flowchart 方向</code> — 声明是流程图，以及图的走向<br>2. <code>节点ID[显示文字]</code> — 定义节点<br>3. <code>节点ID --> 节点ID</code> — 用箭头连接节点</p></div>
      <div class="sub-title">两种方向：TD（从上到下）和 LR（从左到右）</div>
      <div class="demo-block"><div class="demo-header"><div class="demo-title">flowchart TD — 从上到下（默认，最常用）</div><div class="demo-tags"><span class="demo-tag demo-tag-type">流程图</span><span class="demo-tag demo-tag-level">入门</span></div></div><div class="demo-body"><div class="demo-grid"><div class="demo-half"><div class="code-box"><button class="copy-btn" onclick="copyCode(this)">复制</button><pre>flowchart TD
  A[第一步] --> B[第二步]
  B --> C[第三步]

      <div class="demo-block"><div class="demo-header"><div class="demo-title">flowchart LR — 从左到右（横向流程）</div><div class="demo-tags"><span class="demo-tag demo-tag-type">流程图</span><span class="demo-tag demo-tag-level">入门</span></div></div><div class="demo-body"><div class="demo-grid"><div class="demo-half"><div class="code-box"><button class="copy-btn" onclick="copyCode(this)">复制</button><pre>flowchart LR
  A[输入] --> B[处理]
  B --> C[输出]
  C --> D[存储]</pre></div></div><div class="demo-half"><div class="preview-box"><img data-mm="flowchart LR; A[输入] --> B[处理]; B --> C[输出]; C --> D[存储]" alt="flowchart LR示例" /></div></div></div></div></div>
      <div class="sub-title">带判断的分支流程</div>
      <div class="demo-block"><div class="demo-header"><div class="demo-title">带菱形判断的分支</div><div class="demo-tags"><span class="demo-tag demo-tag-type">流程图</span><span class="demo-tag demo-tag-level">入门</span></div></div><div class="demo-body"><div class="demo-grid"><div class="demo-half"><div class="code-box"><button class="copy-btn" onclick="copyCode(this)">复制</button><pre>flowchart TD
  A[打开文档] --> B{审核通过?}
  B -->|是| C[批准发布]
  B -->|否| D[打回修改]
  D --> A</pre></div></div><div class="demo-half"><div class="preview-box"><img data-mm="flowchart TD; A[打开文档] --> B{审核通过?}; B -->|是| C[批准发布]; B -->|否| D[打回修改]; D --> A" alt="带判断的分支流程" /></div></div></div></div></div>
      <div class="highlight-box"><h4>💡 多节点合并</h4><p>用 <code>&</code> 符号把多个节点合并在一起。<code>A & B --> C</code> 等于 <code>A --> C</code> 然后 <code>B --> C</code>，但更简洁。</p></div>
    `
  },
  {

// ===== State =====
let currentPage = 0;
const total = chapters.length;
let loadTimer = null;

// ===== Render Sidebar =====
function renderSidebar() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  chapters.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn' + (i === currentPage ? ' active' : '');
    btn.innerHTML = '<span class="ch-num">' + String(ch.num).padStart(2,'0') + '</span><span class="ch-icon">' + ch.icon + '</span><span class="ch-name">' + ch.title + '</span>';
    btn.onclick = () => goToPage(i);
    list.appendChild(btn);
  });
}

// ===== Progressive Image Loading =====
function loadDiagramImages(container) {
  if (loadTimer) clearTimeout(loadTimer);

  const imgs = Array.from(container.querySelectorAll('img[data-mm]'));
  let delay = 0;

  imgs.forEach((img, idx) => {
    const code = img.getAttribute('data-mm');
    if (!code) return;

    // Use cache if available
    if (imgCache.has(code)) {
      const cachedUrl = imgCache.get(code);
      img.src = cachedUrl;
      img.classList.add('loaded');
      return;
    }

    const url = mm(code);

    // Stagger loading: first image immediate, rest 300ms apart
    setTimeout(() => {
      if (img.getAttribute('data-mm') !== code) return; // page changed
      img.src = url;
      imgCache.set(code, url);
      img.onload = () => img.classList.add('loaded');
      img.onerror = () => img.classList.add('failed');
    }, delay);

    delay += 300;
  });
}

// ===== Render Page =====
function renderPage() {
  const ch = chapters[currentPage];

  document.getElementById('pageLabel').textContent = 'Chapter ' + String(ch.num).padStart(2,'0');
  document.getElementById('pageTitle').textContent = ch.title;
  document.getElementById('pageDesc').textContent = ch.desc;
  document.getElementById('pageNum').textContent = ch.num;
  document.getElementById('progressFill').style.width = ((currentPage / (total - 1)) * 100) + '%';

  document.getElementById('btnPrev').classList.toggle('disabled', currentPage === 0);
  document.getElementById('btnNext').classList.toggle('disabled', currentPage === total - 1);

  renderSidebar();

  const frame = document.getElementById('pageFrame');
  const content = document.getElementById('pageContent');

  // Use requestAnimationFrame for smoother transition
  requestAnimationFrame(() => {
    content.innerHTML = ch.content;
    frame.classList.remove('slide-in');
    void frame.offsetWidth;
    frame.classList.add('slide-in');
    loadDiagramImages(content);
  });
}

// ===== Navigation =====
function goToPage(index) {
  if (index < 0 || index >= total) return;
  currentPage = index;
  renderPage();
}
function prevPage() { goToPage(currentPage - 1); }
function nextPage() { goToPage(currentPage + 1); }

// ===== Copy =====
function copyCode(btn) {
  const pre = btn.parentElement.querySelector('pre');
  navigator.clipboard.writeText(pre.textContent).then(() => {
    const orig = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}
function copyPrompt(card) {
  const p = card.querySelector('p');
  navigator.clipboard.writeText(p.textContent).then(() => {
    const btn = card.querySelector('.prompt-copy');
    const orig = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

// ===== Keyboard =====
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') nextPage();
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevPage();
  else if (e.key === 'Home') goToPage(0);
  else if (e.key === 'End') goToPage(total - 1);
});

// ===== Init =====
document.getElementById('totalPages').textContent = total;
renderPage();
</script>
