<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>临时分享 | sq-shiqin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #FFFFFF;
            --bg-secondary: #FAFAFA;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-tertiary: #6e6e73;
            --border: rgba(0, 0, 0, 0.06);
        }
        body {
            font-family: 'Noto Serif SC', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .nav-inner {
            max-width: 980px; margin: 0 auto; padding: 0 22px; height: 52px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo { font-size: 14px; font-weight: 500; letter-spacing: 0.5px; }
        .nav-links { display: flex; gap: 32px; }
        .nav-links a { font-size: 11px; color: var(--text-secondary); text-decoration: none; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text-primary); }
        .header { max-width: 980px; margin: 0 auto; padding: 100px 22px 48px; text-align: center; }
        .header-title { font-size: 36px; font-weight: 400; letter-spacing: 8px; margin-bottom: 12px; }
        .header-sub { font-size: 12px; color: var(--text-secondary); letter-spacing: 2px; font-family: 'Inter', sans-serif; }
        .header-desc { font-size: 14px; color: var(--text-tertiary); margin-top: 16px; line-height: 1.8; }
        .divider { max-width: 980px; margin: 0 auto; padding: 0 22px; }
        .divider hr { border: none; border-top: 1px solid var(--border); }
        .content-section { max-width: 980px; margin: 0 auto; padding: 64px 22px; text-align: center; }
        .section-label { font-size: 9px; color: var(--text-tertiary); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 48px; font-family: 'Inter', sans-serif; }
        .empty-state { background: var(--bg-secondary); border-radius: 12px; padding: 80px 24px; text-align: center; border: 1px dashed var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 480px; margin: 0 auto; }
        .empty-icon { width: 64px; height: 64px; border: 1px dashed var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
        .empty-icon svg { width: 28px; height: 28px; color: var(--text-tertiary); }
        .empty-title { font-size: 18px; font-weight: 400; letter-spacing: 4px; margin-bottom: 10px; }
        .empty-desc { font-size: 13px; color: var(--text-tertiary); line-height: 1.6; }
        .notice { max-width: 980px; margin: 0 auto; padding: 0 22px 64px; text-align: center; }
        .notice-text { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 30px; font-size: 12px; color: var(--text-secondary); letter-spacing: 1px; }
        .notice-dot { width: 6px; height: 6px; background: var(--text-tertiary); border-radius: 50%; }
        .footer { text-align: center; padding: 48px 22px; border-top: 1px solid var(--border); }
        .footer-text { font-size: 11px; color: var(--text-tertiary); letter-spacing: 1px; }
        @media (max-width: 768px) {
            .header-title { font-size: 28px; letter-spacing: 6px; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <div class="nav-logo">sq-shiqin</div>
            <div class="nav-links">
                <a href="../index.html">关于</a>
                <a href="../works.html">作品</a>
                <a href="../net/">长期</a>
                <a href="../tp/">临时</a>
            </div>
        </div>
    </nav>
    <section class="header">
        <div class="header-title">临时分享</div>
        <div class="header-sub">TP</div>
        <div class="header-desc">临时性的内容展示<br>用完即删，不做永久保留</div>
    </section>
    <div class="divider"><hr></div>
    <section class="content-section">
        <div class="section-label">Current Content</div>
        <div class="empty-state">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                </svg>
            </div>
            <div class="empty-title">暂无内容</div>
            <div class="empty-desc">
                临时分享区域<br>
                内容等待上传
            </div>
        </div>
    </section>
    <div class="notice">
        <div class="notice-text">
            <span class="notice-dot"></span>
            临时内容区域，如有需要请联系上传
        </div>
    </div>
    <footer class="footer">
        <div class="footer-text">© 2026 石勤 sq-shiqin · 磐石之志 以勤砺石</div>
    </footer>
</body>
</html>
