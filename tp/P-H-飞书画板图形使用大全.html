<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞书画板 · 图形使用大全</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:#0B1120;color:#E2E8F0;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.6;
}
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:52px;
  background:rgba(11,17,32,0.9);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;padding:0 20px;overflow-x:auto;gap:2px;
  -webkit-overflow-scrolling:touch;
}
.nav::-webkit-scrollbar{display:none;}
.nav .logo{color:#E2E8F0;font-weight:700;font-size:13px;white-space:nowrap;margin-right:8px;flex-shrink:0;}
.nav .logo span{color:#5178C6;}
.nav a{
  color:#64748B;text-decoration:none;font-size:11px;padding:4px 8px;
  border-radius:5px;white-space:nowrap;transition:all 0.2s;flex-shrink:0;
}
.nav a:hover{color:#93C5FD;background:rgba(255,255,255,0.03);}
.nav a.active{color:#93C5FD;background:rgba(81,120,198,0.08);}
.hero{
  padding:80px 24px 40px;text-align:center;
  background:radial-gradient(ellipse at 30% 30%,rgba(81,120,198,0.06),transparent 60%),
             radial-gradient(ellipse at 70% 70%,rgba(133,105,203,0.04),transparent 60%);
}
.hero h1{font-size:36px;font-weight:800;letter-spacing:1px;
  background:linear-gradient(135deg,#93C5FD,#C4B5FD,#86EFAC);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero p{color:#64748B;font-size:14px;margin-top:8px;}
.hero .badge{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.hero .badge span{padding:3px 12px;border-radius:10px;font-size:11px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:#94A3B8;}
.wrapper{max-width:1100px;margin:0 auto;padding:0 20px 40px;}
.chart-card{margin-top:16px;border-radius:14px;overflow:hidden;
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);}
.chart-card:hover{border-color:rgba(255,255,255,0.1);}
.chart-card .head{
  display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;user-select:none;
}
.chart-card .head .num{
  width:28px;height:28px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:700;
  flex-shrink:0;color:#fff;
}
.chart-card .head .icon{font-size:26px;flex-shrink:0;width:34px;text-align:center;}
.chart-card .head .info{flex:1;min-width:0;}
.chart-card .head .info h3{font-size:15px;font-weight:600;color:#E2E8F0;}
.chart-card .head .info .en{font-size:10px;color:#475569;margin-top:0;}
.chart-card .head .toggle{font-size:16px;color:#475569;transition:transform 0.3s;flex-shrink:0;}
.chart-card.open .head .toggle{transform:rotate(180deg);}
.chart-card .body{display:none;padding:0 20px 20px;border-top:1px solid rgba(255,255,255,0.04);padding-top:14px;}
.chart-card.open .body{display:block;}

/* 预览图 */
.preview-wrap{
  text-align:center;margin-bottom:16px;
  background:rgba(255,255,255,0.015);border-radius:10px;
  border:1px solid rgba(255,255,255,0.04);padding:8px;overflow:hidden;
}
.preview-wrap svg{max-width:100%;height:auto;display:inline-block;border-radius:6px;}
.body .desc{font-size:13px;color:#94A3B8;margin-bottom:10px;line-height:1.6;}
.body .meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.body .meta-item{padding:6px 10px;border-radius:6px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);}
.body .meta-item .label{font-size:9px;color:#475569;text-transform:uppercase;letter-spacing:0.5px;}
.body .meta-item .value{font-size:12px;color:#94A3B8;margin-top:1px;}
.body .meta-item .value.code{font-family:"SF Mono",monospace;font-size:10px;color:#93C5FD;}
.body .scenes-title{font-size:12px;font-weight:600;color:#94A3B8;margin-bottom:4px;}
.body .scene-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;}
.body .scene-tags span{font-size:11px;padding:2px 8px;border-radius:4px;
  background:rgba(255,255,255,0.03);color:#64748B;border:1px solid rgba(255,255,255,0.04);}
.body .prompt-title{font-size:12px;font-weight:600;color:#94A3B8;margin-bottom:4px;}
.body .code-block{
  background:#0F172A;border:1px solid rgba(255,255,255,0.06);
  border-radius:7px;padding:10px 14px;margin-bottom:6px;position:relative;
  font-family:"SF Mono","Menlo","Monaco",monospace;
  font-size:11px;color:#94A3B8;line-height:1.5;overflow-x:auto;
}
.body .code-block .copy-btn{
  position:absolute;top:5px;right:5px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);
  color:#64748B;padding:2px 7px;border-radius:3px;font-size:9px;
  cursor:pointer;transition:all 0.2s;font-family:inherit;
}
.body .code-block .copy-btn:hover{background:rgba(255,255,255,0.1);color:#E2E8F0;}
.body .code-block .copy-btn.copied{background:rgba(80,152,99,0.2);color:#86EFAC;}
.template-section{
  margin-top:28px;padding:24px 28px;border-radius:14px;
  background:linear-gradient(135deg,rgba(81,120,198,0.06),rgba(133,105,203,0.06));
  border:1px solid rgba(81,120,198,0.12);
}
.template-section h3{font-size:16px;font-weight:600;margin-bottom:6px;color:#93C5FD;}
.template-section p{font-size:12px;color:#94A3B8;margin-bottom:8px;line-height:1.6;}
.guide-section{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;}
.guide-card{padding:16px;border-radius:10px;
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);}
.guide-card h4{font-size:13px;font-weight:600;margin-bottom:4px;}
.guide-card p{font-size:11px;color:#64748B;line-height:1.6;}
.guide-card .demo{font-size:11px;color:#94A3B8;padding:6px 10px;margin-top:6px;
  background:rgba(255,255,255,0.03);border-radius:5px;font-family:"SF Mono",monospace;line-height:1.5;}
.tips-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px;}
.tip-item{padding:12px 14px;border-radius:8px;
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);
  font-size:12px;color:#94A3B8;line-height:1.5;}
.tip-item strong{color:#E2E8F0;}
.footer{text-align:center;padding:28px;color:#475569;font-size:11px;border-top:1px solid rgba(255,255,255,0.04);}
@media(max-width:768px){
  .hero h1{font-size:26px;}
  .chart-card .head{padding:12px 14px;}
  .chart-card .body{padding:0 14px 14px;}
  .body .meta-grid{grid-template-columns:1fr;}
  .guide-section,.tips-grid{grid-template-columns:1fr;}
  .nav a{font-size:10px;padding:3px 6px;}
}
</style>
</head>

    '<div class="tip-item"><strong>生成后可编辑</strong>——双击进编辑态</div>' +
    '<div class="tip-item"><strong>样式统一</strong>——飞书生态内风格一致</div>' +
    '<div class="tip-item"><strong>无需切窗口</strong>——全部闭环</div>' +
    '<div class="tip-item"><strong>节点数 ≤ 100</strong></div>' +
    '<div class="tip-item"><strong>持续更新</strong>——新图形陆续支持</div>' +
    '<div class="tip-item"><strong>不确定类型就说内容</strong>——AI判断</div></div>';

  document.getElementById('content').innerHTML = html;
  // 导航
  var n = '<span class="logo">◈ <span>画板</span></span><a href="#hero" class="nl">概览</a>';
  charts.forEach(function(c){n += '<a href="#c' + c.id + '" class="nl">' + c.icon + c.title + '</a>';});
  document.getElementById('navBar').innerHTML = n;
  // 导航高亮
  var ls = document.querySelectorAll('.nl');
  window.addEventListener('scroll',function(){
    var cur = '';
    document.querySelectorAll('.chart-card').forEach(function(s){
      if(window.scrollY >= s.offsetTop - 80) cur = s.getAttribute('id');
    });
    ls.forEach(function(a){a.style.color = a.getAttribute('href') === '#' + cur ? '#93C5FD' : '#64748B';});
  });
}

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyCmd(btn,t){navigator.clipboard.writeText(t).then(function(){btn.textContent='已复制';btn.classList.add('copied');setTimeout(function(){btn.textContent='复制';btn.classList.remove('copied');},2000);});}

document.addEventListener('DOMContentLoaded',render);
</script>
</body>
</html>
